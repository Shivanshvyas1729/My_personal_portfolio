# region PROJECTS
projects:
  - id: 7
    title: NeuroCart / SmartReco — Behavioral AI Recommendation Agent
    category:
      - Agentic Systems & MCP
      - Machine Learning
      - MLOps
      - Python
      - Web Applications
    description: An agentic, hyper-personalized recommendation platform for modern e-commerce and learning marketplaces. Instead of static rules or cold click counts, NeuroCart features a real-time 17-signal behavioral AI agent that continuously observes user browsing activity, semantically retrieves candidate items via ChromaDB Vector RAG, and re-ranks courses using Mesh API LLM with Pydantic structured output validation.
    tech:
      - Python
      - FastAPI
      - ChromaDB
      - Mesh API
      - OpenAI SDK
      - Pydantic
      - SQLite
      - JavaScript
      - Jinja2
      - APScheduler
    github: https://github.com/Shivanshvyas1729/ai-powered-Behavioral-Recommendation-system-
    live: https://neurocart-smartreco.onrender.com
    featured: true
    domain: E-Commerce & EdTech
    media:
      - type: image
        url: https://raw.githubusercontent.com/Shivanshvyas1729/ai-powered-Behavioral-Recommendation-system-/main/ai%20behaviral%20recommandation%20system%402x.png
    problem_statement: Traditional e-commerce recommendation widgets rely on static 'related items' rules or simple click counters that ignore rich user context. Users are served cold, irrelevant product recommendations because legacy systems fail to observe active exploration signals like dwell duration, curriculum expansions, text highlighting, and search query shifts.
    business_problem: Generic recommendation widgets suffer from low conversion rates (under 2%) and high drop-offs due to irrelevant suggestions. Slow multi-pass LLM recommendation chains (4.5s+ latency) degrade user experience and consume excessive API tokens, resulting in high cloud runtime costs and missed revenue.
    learning_outcomes:
      - Architected a 17-signal non-blocking telemetry engine using JS tracker.js and sendBeacon API
      - Implemented dual-write SQLite and ChromaDB vector persistence for zero-lag catalog indexing
      - Engineered a 3-layer performance pipeline cutting LLM recommendation latency from 4.5s to <0.8s
      - Integrated Mesh API Gateway with Pydantic structured output validation for 100% type-safe JSON response generation
    architecture: "The system follows a multi-tier agentic workflow: 1) Client-side telemetry engine (tracker.js) captures 17 natural intent signals non-blockingly and batches events via sendBeacon API. 2) Backend FastAPI server processes event stream, updating SQLite database and evaluating target-aware cooldown & 15s TTL in-memory cache. 3) Vector RAG engine queries ChromaDB for top-10 semantic candidate products (<2ms). 4) Mesh API Gateway (openai/gpt-4o-mini) performs single-pass re-ranking and generates warm, customer-centric reasons validated via Pydantic schemas. 5) Live UI streams warm recommendation cards with 0ms background execution."
    architectureImage: https://raw.githubusercontent.com/Shivanshvyas1729/ai-powered-Behavioral-Recommendation-system-/main/ai%20behaviral%20recommandation%20system%402x.png
    resources:
      - label: GitHub Repository
        url: https://github.com/Shivanshvyas1729/ai-powered-Behavioral-Recommendation-system-
      - label: Live Demo Deployment
        url: https://neurocart-smartreco.onrender.com
    howItWorks: |-
      1. User browses course pages, highlights text, searches topics, and expands module curricula.
      2. tracker.js captures natural intent statements (e.g., 'User spent 18s reading MLOps') without freezing UI navigation.
      3. Batched events POST to /api/events/batch.
      4. SmartRecoAgent checks target-aware 10s cooldown and 15s TTL cache.
      5. ChromaDB vector database performs top-10 candidate retrieval using 1536-dimensional cosine embeddings.
      6. Mesh API LLM re-ranks candidates and returns Pydantic-validated JSON containing warm, customer-centric recommendation badges.
      7. UI updates live recommendations via SSE / async polling.
    objectives:
      - Reduce end-to-end AI recommendation generation latency to under 0.8 seconds
      - Eliminate zero-click cold-start mismatches using a 3-event threshold and category scoping
      - Achieve 100% structured response reliability using Pydantic schema validation
    success_criteria:
      - Zero UI thread blocking during continuous high-frequency user telemetry tracking
      - Over 5x reduction in LLM inference overhead via single-pass RAG candidate retrieval
      - 100% synchronization consistency across SQLite database and ChromaDB vector store during CRUD operations
    data_sources:
      - https://github.com/Shivanshvyas1729/ai-powered-Behavioral-Recommendation-system-/blob/main/app/database.py
    data_volume: 38 rich production courses across AI/ML, Data Engineering, MLOps, and Cloud DevOps with 15 detailed metadata attributes per record
    class_distribution: "AI/ML & Agentic Systems: 35%, Data Engineering: 25%, MLOps & Infrastructure: 22%, Cloud & DevOps: 18%"
    target_variable: Recommended Course IDs & Pydantic-Validated Recommendation Narrative (CourseReasonItem)
    features:
      - 17 Natural intent telemetry signals (page views, search queries, filter selections, dwell time, scroll depth, text highlights, curriculum expansions)
      - Course metadata embeddings (1536-dimensional dense vectors combining title, category, price, tech stack, learning outcomes)
    feature_engineering:
      - Natural human-intent statement generation in tracker.js ('User spent 18s reading MLOps')
      - Automatic per-topic dwell timer snapshot flushing to prevent attribution race conditions
      - 1536-dimensional text embedding generation via Mesh API (text-embedding-3-small)
    model_inputs:
      - Aggregated user telemetry event stream (up to 20 recent events)
      - Top-10 candidate course metadata JSON objects retrieved from ChromaDB HNSW index
    model_outputs:
      - Pydantic-validated AgentRecommendationPayload containing overall narrative string and array of CourseReasonItem objects
      - Top-2 re-ranked course recommendations with customer-centric 'Why AI Suggested' reason badges
    preprocessing:
      - Batched event queue buffering (flushed every 3 seconds or 6 accumulated events)
      - Vector text chunk composition formatting title, category, level, price, and description before embedding
    modeling:
      - "Dense Vector Candidate Retrieval: ChromaDB HNSW cosine similarity index (<2ms lookup)"
      - "Single-Pass Re-Ranking & Narrative Generation: Mesh API Gateway with openai/gpt-4o-mini"
    hyperparameters:
      - "Top-K Candidate Retrieval: K=10"
      - "LLM Temperature: 0.3"
      - "TTL Cache Window: 15 seconds"
      - "Same-Target Cooldown: 10 seconds"
      - "Minimum Intent Event Threshold: 3 events"
    evaluation_metrics:
      - End-to-End Latency (<0.8s target)
      - Vector DB Retrieval Time (<2ms)
      - Pydantic Schema Validation Success Rate (100%)
      - Token Reduction Factor (>60% savings vs 3-pass chain)
    metrics:
      Test Accuracy: 100% Pydantic Parse Rate
      ROC-AUC: 0.982 Vector Retrieval Precision
      Model Size: 1536-dim Embeddings
      Dataset Size: 38 Production Courses
      Avg Inference Time: 740ms
    validation_strategy: Automated end-to-end integration tests (test_end_to_end.py) verifying registration, event batching, trace latency logging (vector DB vs LLM time), and Pydantic response parsing.
    explainability: Integrated warm 'Why AI Suggested' badges generated per recommendation, explaining exact correlation between tracked user intent signals (e.g. MLOps browsing) and course properties (e.g. budget, tech stack).
    training_environment:
      - Python 3.11, FastAPI 0.109+, Pydantic 2.6+, ChromaDB 0.4+
      - "Deployment Environment: Render Web Service (Python 3.11 runtime)"
    deployment: Deployed as a Uvicorn/FastAPI application hosted on Render connected to a persistent ChromaDB vector index and Mesh API gateway.
    inference_pipeline:
      - Capture user action via tracker.js and send batch to /api/events/batch
      - Evaluate target-aware cooldown and in-memory 15s TTL cache
      - Execute ChromaDB HNSW cosine vector search for Top-10 candidates
      - Pass candidates and event narrative to Mesh API (openai/gpt-4o-mini)
      - Validate JSON output against Pydantic schema and return live recommendation payload
    monitoring:
      - Live telemetry dashboard at /engine recording event timestamps, trace IDs, vector DB latency, LLM latency, and overall execution status
      - File logger persisting logs to smartreco.log and agent_triggers.log
    versioning:
      - Git repository tag versioning (v1.0.0)
      - Render deployment build filtering for documentation and log skips
    risks:
      - Potential API gateway rate limiting during sudden traffic bursts
      - Fallback vectorizer quality degradation if Mesh API key is unconfigured
    ethics:
      - User telemetry is anonymized per session with HTTP-only cookies
      - No personal identifying information (PII) is included in LLM prompts or vector embeddings
    privacy:
      - Uploaded images and user behavioral tracking processed in-memory and stored per session only
      - No third-party cross-site trackers or external advertising analytics used
    known_limitations:
      - Vector candidate retrieval relies on catalog embeddings updated during product dual-write
      - Cold-start users with <3 intent events receive default category exploration prompt
    future_improvements:
      - Implement LangGraph multi-agent orchestration nodes for multi-turn conversational advice
      - Add daily proactive recommendation digests via Email and Telegram schedulers using Mesh Batch API
    open_resources:
      - label: GitHub Source Code
        url: https://github.com/Shivanshvyas1729/ai-powered-Behavioral-Recommendation-system-
      - label: Render Production Web App
        url: https://neurocart-smartreco.onrender.com
    knowledge_overrides:
      - id: ChromaDB Vector RAG
        definition: An open-source embedding database designed for fast vector search and retrieval-augmented generation.
        real_world_example: Retrieves top 10 course candidates in <2ms using 1536-dimensional HNSW cosine similarity indices.
        why_used: Enables ultra-fast local semantic retrieval to scope LLM re-ranking inputs.
      - id: Mesh API Gateway
        definition: An OpenAI-compatible unified API gateway providing single-key access to 1000+ AI models with lowest-latency routing.
        real_world_example: Routes recommendation requests to lowest-latency model endpoints (openai/gpt-4o-mini) with automatic failover.
        why_used: Provides fast, reliable, and cost-effective LLM inference with built-in routing optimization.
      - id: Pydantic Schema Validation
        definition: Data validation and settings management library using Python type annotations.
        real_world_example: Validates LLM response payloads into AgentRecommendationPayload and CourseReasonItem structures.
        why_used: Guarantees 100% type-safe JSON structure for frontend UI rendering without parsing errors.
  - id: 6
    title: Real-Time YouTube Script Generator & MCP Server
    category:
      - LLMs & Generative AI
      - Python
    description: An AI-powered application and FastMCP server that retrieves real-time web information using Tavily Search API and converts it into high-retention, production-ready short video scripts (YouTube Shorts / Reels) using Gemini LLM.
    tech:
      - Python
      - FastMCP
      - Streamlit
      - Tavily Search API
      - Google Gemini API
      - OpenAI SDK
      - Web-Searching RAG
    github: https://github.com/Shivanshvyas1729/Real-Time-YouTube-Script-Generator-MCP-Server
    live: https://real-time-youtube-script-generator-mcp-server-kv2sp2x863hpu8bh.streamlit.app/
    featured: true
    domain: Media & Entertainment
    media:
      - secureUrl: https://res.cloudinary.com/dnw73uesc/image/upload/v1785582812/Gemini_Generated_Image_t9zmutt9zmutt9zm_sivbr0.png
        publicId: Gemini_Generated_Image_t9zmutt9zmutt9zm_sivbr0
        resourceType: image
    problem_statement: Standard LLMs suffer from knowledge cutoff dates and hallucinate when asked to generate scripts on breaking news or current events. Additionally, drafting engaging short-form video scripts (Shorts/Reels) requires strict structural formatting (hooks, visual cues, spoken dialogue) that standard prompts fail to deliver reliably.
    business_problem: Content creators and video marketing teams spend excessive hours manually researching current web trends and writing formatted video scripts, resulting in low publishing velocity and missed viral opportunities on trending topics.
    learning_outcomes:
      - Architected real-time retrieval-augmented pipelines using Tavily Search API to eliminate LLM hallucinations on breaking news
      - Implemented Model Context Protocol (FastMCP) servers to expose Python functions directly as tools for AI assistants like Claude Desktop and Cursor
      - Built resilient fallback mechanisms to ensure 100% UI uptime even during third-party LLM API rate limits or failures
      - Crafted structured short-form script prompt templates that separate visual cues from spoken dialogue for immediate production use
    architecture: Dual-interface architecture featuring an interactive Streamlit Web Application and a FastMCP Server over stdio. The core Python engine queries Tavily API for top real-time search results, summarizes the content using Gemini LLM (via OpenAI SDK compatibility or native Google GenAI SDK), and feeds the context into a specialized scriptwriter engine structured for maximum audience retention (Hook → Frame → Payload → CTA).
    architectureImage: https://res.cloudinary.com/dnw73uesc/image/upload/v1785582067/3242_pwn0wl.png
    resources:
      - label: Live Streamlit App
        url: https://real-time-youtube-script-generator-mcp-server-kv2sp2x863hpu8bh.streamlit.app/
      - label: GitHub Repository
        url: https://github.com/Shivanshvyas1729/Real-Time-YouTube-Script-Generator-MCP-Server
    howItWorks: |-
      1. User inputs a topic/query via the Streamlit UI or MCP client tool.
      2. Tavily Search API fetches top 3 advanced real-time web results.
      3. Gemini LLM synthesizes search snippets into a ~200-word factual summary (with fallback to raw search snippets if LLM fails).
      4. Scriptwriter engine converts summary context into a YouTube Shorts script complete with [Visual Cues] and (Spoken Words).
      5. User previews, edits, or downloads the script as a `.txt` file.
    objectives:
      - Achieve real-time web retrieval and AI summarization in under 3 seconds per query
      - Expose standardized MCP tools (`get_latest_info_mcp`, `get_video_script_mcp`) for external AI agents
      - Ensure zero app crashes via robust try/except fallback mechanisms
    success_criteria:
      - Zero application downtime when external LLM endpoints fail
      - Seamless one-click script download (.txt) for creators
      - Full compatibility with FastMCP tools inspector and Claude Desktop
    data_sources:
      - Tavily Search API (Real-Time Web Crawl & Search Snippets)
    model_inputs:
      - User topic query (str)
      - Real-time web search markdown context string
    model_outputs:
      - Concise AI research summary (~200 words)
      - Production video script with [Visual Cues] and (Spoken Words)
    preprocessing:
      - Filter and format Tavily JSON search results into Markdown snippets containing title, content, and URL source
      - Construct role-based system and user prompt payloads
    modeling:
      - Gemini 2.0 Flash Lite (`gemini-2.0-flash-lite-001`) via OpenAI SDK endpoint compatibility
      - Gemini 2.0 Flash (`gemini-2.0-flash`) via official `google-genai` SDK
    hyperparameters:
      - "Summarization Temperature: 0.3 (Fact-focused & concise)"
      - "Script Generation Temperature: 0.7 (Creative & engaging)"
      - "Search Max Results: 3"
      - "Search Depth: 'advanced'"
    evaluation_metrics:
      - Real-Time Retrieval Speed (seconds)
      - Script Retention Structure Adherence (Hook/Frame/Payload/CTA presence)
      - Fallback Activation Reliability
    deployment: Streamlit Community Cloud (for browser UI) and local FastMCP server execution via `uv run mcp_server.py`.
    inference_pipeline:
      - Receive search query string
      - Query Tavily Client API for max 3 advanced web results
      - Run LLM Summarization prompt with temperature 0.3
      - Fallback to raw markdown snippets if summarization raises an exception
      - Run Scriptwriter prompt with temperature 0.7
      - Return script string to UI text area or MCP caller
    risks:
      - Dependence on third-party Tavily API service availability and query quotas
      - Variable web search snippet quality depending on niche topic specificity
    ethics:
      - Includes source URLs for web content attribution in fallback mode
      - Uses official API endpoints avoiding unauthorized website scraping
    privacy:
      - Search queries and script contents are processed in-memory only and never persisted to a database
    known_limitations:
      - Requires active internet connection and valid API keys (`TAVILY_API_KEY`, `AICREDITS_API_KEY` / `GEMINI_API_KEY`)
      - Tailored specifically for short-form scripts (15-60 seconds)
    future_improvements:
      - Add multi-modal AI storyboarding (automated image generation for visual cues)
      - Support adjustable video lengths (15s, 30s, 60s, 3-min longform)
      - Integrate text-to-speech audio generation (e.g. ElevenLabs API) for automated voiceovers
    knowledge_overrides:
      - id: FastMCP
        definition: A high-level Python framework for building Model Context Protocol (MCP) servers effortlessly.
        real_world_example: Exposing local Python functions as executable tools in Cursor IDE or Claude Desktop.
        why_used: Enables seamless AI tool interoperability without writing raw MCP transport boilerplate.
      - id: Tavily Search API
        definition: A search engine optimized specifically for AI agents and LLMs to retrieve real-time, factual web data.
        real_world_example: Fetching up-to-the-minute news snippets formatted for direct prompt context insertion.
        why_used: Eliminates LLM training cutoff limits and reduces hallucination on recent topics.
  - id: 5
    title: Cancer Detection with explainable AI
    category:
      - Deep Learning
      - Computer Vision
      - Explainable AI (XAI)
    description: Thyroid cancer cases are increasing worldwide, but in many rural and remote areas, expert doctors and diagnostic facilities are not easily available. Traditional diagnosis mainly depends on ultrasound imaging and specialist interpretation, which can be expensive, time-consuming, and inaccessible in low-resource regions. Many existing AI models focus only on achieving high accuracy, but they often require high computational power and complex hardware. Such systems are difficult to deploy in rural healthcare centers where resources are limited. Therefore, there is a need for a lightweight, cost-effective, and explainable AI-based system that can assist doctors and healthcare workers in detecting thyroid cancer efficiently.
    tech:
      - Python
      - TensorFlow
      - FastAPI
      - Streamlit
      - Grad-CAM
      - Hugging Face Hub
    github: https://github.com/Shivanshvyas1729/Cancer_Detection_with_xai
    live: https://cancerdetectionwithxai.streamlit.app/
    featured: true
    domain: Healthcare
    media:
      - url: https://i.ibb.co/0j93F19k/719086-750.jpg
        type: image
      - url: https://i.ibb.co/PZDrx9Qn/df08103d-28d6-4be4-9257-b27ff3322dc3.jpg
      - url: https://i.ibb.co/XZp3XZgC/fibo-arch.png
    problem_statement: Thyroid Cancer is a disease in which harmful or abnormal cells grow in the thyroid gland located in the neck. The thyroid gland controls important body functions such as metabolism, energy balance, heart rate, and hormone production. If thyroid cancer is not detected at an early stage, it can spread to nearby organs and become life-threatening. Manual diagnostic evaluation of thyroid ultrasound images is time-consuming, subjective, and dependent on specialist expertise. Furthermore, black-box AI systems lack transparency, creating a need for lightweight explainable computer-aided diagnostic systems that can support healthcare professionals in low-resource and rural environments.
    learning_outcomes:
      - Designed Fibonacci-Net, a custom lightweight CNN using Fibonacci filter progression, depthwise separable convolutions, and a custom Avg2MaxPooling layer for high-precision image classification.
      - Trained and evaluated the model on a complex image dataset of 3,115 samples, achieving a ROC-AUC score of 0.915 while maintaining a highly efficient 18.48 MB model footprint.
      - Integrated Grad-CAM explainability and deployed the solution through FastAPI APIs and a Streamlit dashboard for real-time inference and automated report generation.
      - Implemented Fibonacci filter progression (21 → 34 → 55 → 89 → 144 → 233 → 377) for efficient feature extraction.
      - Developed a custom Avg2MaxPooling layer combining average and max pooling.
      - Integrated Grad-CAM explainability heatmaps for transparent AI predictions.
      - Built REST APIs using FastAPI for scalable model serving.
      - Developed an interactive Streamlit dashboard for real-time inference.
      - Implemented automated diagnostic report generation using python-docx.
    architecture: The system follows a client-server architecture. Users upload thyroid ultrasound images through a FastAPI frontend or Streamlit dashboard. Images are preprocessed and passed to a custom lightweight CNN called Fibonacci-Net. The model predicts benign or malignant thyroid nodules and generates Grad-CAM heatmaps for explainability. Results and visual explanations are displayed to the user and packaged into downloadable diagnostic reports. The architecture is designed to remain lightweight and suitable for deployment in low-resource healthcare environments.
    architectureImage: https://i.ibb.co/p6CzTSCX/9fed8422-4558-4568-ad5f-68f70186a6a9.jpg
    resources:
      - url: https://excalidraw.com/#json=ZBBfaXHadM-TQNDIhaRKw,69m8_fH4TKqm7AQq-mMfTw
        label: excalidraw
      - label: whole drive link
        url: https://drive.google.com/drive/folders/1Kp7T_7QMJO2OW4agrAtCmV5CsKz7uUjQ
      - label: research
        url: https://drive.google.com/drive/u/0/folders/1WeKzWkeb7GvV_xYDwJLzbdd-kXy29vov
    howItWorks: 1. The user uploads a thyroid ultrasound image through the FastAPI web interface or Streamlit dashboard. 2. The image is converted to RGB format, resized to 224×224 pixels, and normalized. 3. The custom Fibonacci-Net CNN processes the image and predicts whether the thyroid nodule is benign or malignant. 4. Grad-CAM generates a heatmap highlighting the image regions that influenced the prediction. 5. Results are displayed with visual explanations through the web interface. 6. A downloadable diagnostic report containing the prediction and explainability visualization is generated.
    objectives:
      - Develop a lightweight thyroid cancer detection system suitable for low-resource healthcare environments.
      - Provide explainable AI predictions using Grad-CAM visualizations.
      - Assist doctors and healthcare workers during preliminary thyroid cancer screening.
      - Reduce dependency on specialist interpretation in rural and remote regions.
      - Enable fast, cost-effective, and accessible diagnostic assistance.
    success_criteria:
      - Achieve high classification accuracy on thyroid ultrasound images.
      - Generate Grad-CAM visualizations in real time.
      - Provide downloadable diagnostic reports.
      - Maintain low computational requirements suitable for rural healthcare deployment.
      - Deliver explainable predictions that can support clinical decision-making.
    data_sources:
      - https://www.kaggle.com/datasets/diveshzz/thyroid-cancer-classification-ultrasound-dataset/data
    target_variable: Nodule Malignancy Class (0 = Benign, 1 = Malignant)
    features:
      - Thyroid Nodule Classification
      - Custom Fibonacci-Net CNN
      - Grad-CAM Explainable AI
      - Automated Diagnostic Report Generation
      - FastAPI REST API
      - Interactive Streamlit Dashboard
      - Real-Time Inference
      - Low-Resource Deployment Support
    model_inputs:
      - Thyroid Ultrasound Images (224×224 RGB)
    preprocessing:
      - RGB conversion
      - Image resizing to 224×224 pixels
      - Pixel normalization to the range [0,1]
      - Batch dimension expansion for inference
    modeling:
      - Custom Fibonacci-Net CNN Architecture
      - Fibonacci Filter Progression (21 → 34 → 55 → 89 → 144 → 233 → 377)
      - Depthwise Separable Convolutions
      - Avg2MaxPooling Custom Layer
      - Binary Cross Entropy Loss
      - Adam Optimizer
    evaluation_metrics:
      - Accuracy
      - ROC-AUC
      - Binary Cross-Entropy Loss
      - Inference Latency
    validation_strategy: 80-10-10 stratified train-validation-test split
    explainability: Grad-CAM (Gradient-weighted Class Activation Mapping) heatmaps generated from the final convolutional layer to highlight image regions responsible for model predictions and improve transparency.
    deployment: FastAPI backend and Streamlit dashboard deployment with model weights hosted on Hugging Face Hub. The solution is optimized for lightweight inference and deployment in low-resource healthcare environments.
    risks:
      - Class imbalance may lead to model overfitting.
      - Ultrasound image quality variations can affect prediction accuracy.
      - Noise and scanner variability may impact model performance.
      - False predictions may occur in challenging imaging conditions.
      - The system should not be used as a replacement for professional medical diagnosis.
    ethics:
      - Dataset consists of anonymized medical images.
      - Designed as a Clinical Decision Support (CDS) system rather than a diagnostic replacement.
      - Grad-CAM visualizations improve transparency and interpretability.
      - Supports healthcare professionals but does not replace clinical expertise.
      - Final medical decisions should always be validated by qualified healthcare professionals.
    open_resources:
      - url: https://drive.google.com/drive/u/0/folders/1WeKzWkeb7GvV_xYDwJLzbdd-kXy29vov
        label: Research
      - label: depth wise convolution layer
        url: https://link.excalidraw.com/p/readonly/nTbHqs6Z6NhUWvvaQ1Zq
    metrics:
      Accuracy: 90.2%
      ROC-AUC: "0.915"
      Model Size: 18.48 MB
      Dataset Size: 3,115 images
  - id: 4
    title: Automated Defect Detection System (Computer Vision)
    category:
      - Deep Learning
      - Computer Vision
    description: An AI-powered solar panel defect detection system built using transfer learning with ResNet50. The solution automatically classifies solar panel images into multiple defect categories such as dust, bird drops, electrical damage, physical damage, and snow coverage. Deployed through an interactive Streamlit web application, the system enables fast, accurate, and scalable defect inspection, reducing the need for manual monitoring and improving solar farm maintenance efficiency.
    media:
      - type: image
        url: https://i.ibb.co/fdj291HQ/Gemini-Generated-Image-14r8ms14r8ms14r8.png
    tech:
      - Python
      - TensorFlow
      - ResNet50
      - Streamlit
      - Computer Vision
    github: https://github.com/Shivanshvyas1729/solar_panel_defect_detection
    live: https://solarpaneldefectdetection.streamlit.app/
    featured: true
    domain: Renewable Energy
    impact: Improves efficiency of solar panel maintenance by enabling quick and automated defect detection, reducing manual inspection effort and supporting scalable renewable energy operations.
    architectureImage: https://backend.krishnaik.in/media/project_architecture_diagrams/Gemini_Generated_Image_vwro75vwro75vwro_UvMo1qV.jpg
    problem_statement: Manual inspection of solar panels across large solar farms is time-consuming, error-prone, and costly. Defects such as dust accumulation, bird droppings, physical cracks, and electrical damage significantly reduce energy output if left undetected. There is a need for an automated, scalable, and accurate computer vision system that can classify panel defects from images and enable proactive maintenance to maximise renewable energy generation efficiency.
    learning_outcomes:
      - Developed a multi-class computer vision system for automated industrial inspection across six defect categories.
      - Fine-tuned a pretrained ResNet50 model on a specialized image dataset, achieving 81.4% validation accuracy.
      - Built and deployed a Streamlit application providing real-time defect classification, Top-3 prediction analysis, and confidence score visualization.
    architecture: The system is a single-page Streamlit application. A user uploads a solar panel image, which is preprocessed before being passed to a fine-tuned ResNet50 classification model. The model outputs a defect class with Top-3 prediction probabilities and confidence scores. Pretrained ImageNet weights are loaded via TensorFlow/Keras, and the custom classification head is trained on the solar panel defect dataset.
    objectives:
      - Build an accurate multi-class solar panel defect classifier using transfer learning.
      - Classify 6 defect categories — dust, bird drops, electrical damage, physical damage, snow coverage, and clean panels.
      - Deploy an interactive web application for real-time defect detection.
      - Minimize training data requirements by leveraging pretrained ResNet50 weights.
      - Provide Top-3 class predictions with confidence scores for each inference.
    success_criteria:
      - Achieve high classification accuracy across all 6 defect categories.
      - Generate Top-3 prediction probabilities for each uploaded image.
      - Successfully deploy a responsive Streamlit web app for real-time inference.
      - Enable fast inference suitable for field-use inspection workflows.
    data_sources:
      - Kaggle Solar Panel Defect Dataset (bird drop, dust, electrical damage, physical damage, snow, clean)
    target_variable: Solar Panel Defect Class (6 categories — Bird Drop, Dust, Electrical Damage, Physical Damage, Snow, Clean)
    features:
      - Bird-drop Detection
      - Dust Detection
      - Electrical Damage Detection
      - Physical Damage Detection
      - Snow Coverage Detection
      - Clean Panel Classification
      - Top-3 Prediction Analysis
      - Confidence Score Visualization
    model_inputs:
      - Solar panel images (224×224 RGB)
    model_outputs:
      - Defect class label
      - Top-3 class probabilities with confidence scores
    preprocessing:
      - Image loading using PIL
      - Image resizing for ResNet50
      - Tensor conversion
      - Pixel normalization
      - Batch dimension creation for inference
    modeling:
      - Pretrained ResNet50 Backbone
      - Custom Classification Head
      - Fully Connected Dense Layer
